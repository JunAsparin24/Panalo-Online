<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#711a26">
  <title>PANALO! Buzzer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23711a26'/%3E%3Cpath d='M32 11l6.2 12.6 13.8 2-10 9.8 2.4 13.8L32 42.7l-12.4 6.5 2.4-13.8-10-9.8 13.8-2z' fill='%23f4c76a'/%3E%3C/svg%3E">

  <!-- Fonts (falls back to Impact / system fonts if the phone is offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700&family=Sancreek&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/buzzer/buzzer.css">
</head>
<body>
  <!-- =========================================================
       PHONE BUZZER — the site's main page. Players type the
       4-letter game code (or open /?room=CODE).
       Talks to server/server.js.
       ========================================================= -->
  <header class="top-bar">
    <span class="top-bar__title">PANALO!</span>
    <button id="change-team-button" class="top-bar__team" type="button" hidden></button>
  </header>

  <!-- Shown when the connection to the game drops -->
  <p id="connection-banner" class="connection-banner" hidden>Reconnecting to the game&hellip;</p>

  <!-- Opened without a game code: type the code the host gives you -->
  <main id="join-screen" class="screen join-screen" hidden>
    <p class="phone-title">Join a game</p>
    <form id="join-form" class="phone-form">
      <label class="phone-form__label" for="join-code">Game code</label>
      <input id="join-code" class="phone-form__input" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      <p id="join-error" class="join-screen__error" hidden>There's no game with that code. Check it with your host.</p>
      <button class="phone-button" type="submit">Join</button>
    </form>
    <a class="join-screen__host-link" href="/play">Want to host your own game? &rarr;</a>
  </main>

  <!-- Step 1: pick your team -->
  <main id="team-screen" class="screen" hidden>
    <h1 class="screen__heading">Pick your team</h1>
    <div id="team-list" class="team-list"></div>
    <p id="no-teams-message" class="screen__note" hidden>Waiting for the host to set up teams&hellip;</p>
  </main>

  <!-- Step 2: the buzzer -->
  <main id="buzz-screen" class="screen" hidden>
    <button id="buzz-button" class="buzz-button" type="button">
      <span id="buzz-button-main" class="buzz-button__main">Tap to answer</span>
      <span id="buzz-button-sub" class="buzz-button__sub"></span>
    </button>
    <p id="buzz-status" class="buzz-status" aria-live="assertive"></p>
  </main>

  <!-- Final Wager: each team types its secret wager (final-wager-phone.js) -->
  <main id="fw-screen" class="screen fw-phone" hidden>
    <p class="phone-title">Final Wager</p>
    <p id="fw-phone-category" class="fw-phone__category"></p>

    <form id="fw-form" class="phone-form">
      <label class="phone-form__label" for="fw-amount">Your wager</label>
      <p id="fw-limit" class="phone-form__limit"></p>
      <input id="fw-amount" class="phone-form__input" type="number" inputmode="numeric" min="0" step="100" placeholder="0">
      <button id="fw-submit" class="phone-button" type="submit">Lock in wager</button>
    </form>

    <p id="fw-phone-status" class="fw-phone__status"></p>
  </main>

  <script src="/buzzer/buzzer.js"></script>
  <script src="/buzzer/final-wager-phone.js"></script>
  <script src="/js/phone-fit.js"></script>
</body>
</html>
